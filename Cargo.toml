[workspace]
resolver = "3"
members = ["crates/core", "crates/seq", "crates/dist"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
# Measurements are meaningless without optimisation. Keep debug symbols so
# profiling can attribute time to source lines.
opt-level = 3
lto = "thin"
debug = true
